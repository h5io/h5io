name: 'Tests'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ github.event.ref }}
  cancel-in-progress: true
on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

permissions:
  contents: read

jobs:
  pytest:
    name: '${{ matrix.os }} / ${{ matrix.python }}'
    runs-on: ${{ matrix.os }}
    env:
      PYTHON_GIL: ${{ endsWith(matrix.python, 't') && '0' || '' }}
    defaults:
      run:
        shell: bash -e {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Latest Python; no h5py wheels yet so build it against system HDF5
          - os: ubuntu-latest
            python: '3.15'
            hdf5-source: true
          # Free-threaded
          - os: ubuntu-latest
            python: '3.14t'
          - os: ubuntu-latest
            python: '3.12'
          - os: macos-latest
            python: '3.10'
          - os: windows-latest
            python: '3.8'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev
          echo "HDF5_DIR=/usr/lib/x86_64-linux-gnu/hdf5/serial" >> $GITHUB_ENV
        if: matrix.hdf5-source
      - run: pip install scipy pandas pytest pytest-cov tables -e .
      - run: pytest -v h5io
      - uses: codecov/codecov-action@v7
        if: success() || failure()
